<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="buyable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="100%" style="stop-color:#00cec9"/>
    </linearGradient>
    <linearGradient id="score" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b894;stop-opacity:0.15"/>
      <stop offset="85%" style="stop-color:#00b894;stop-opacity:0.15"/>
      <stop offset="85%" style="stop-color:#dfe6e9;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#dfe6e9;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" rx="12"/>

  <!-- Header -->
  <text x="40" y="45" fill="#00b894" font-size="14" font-weight="600" letter-spacing="3">SYKES PENNYSTOCK RADAR</text>
  <text x="40" y="70" fill="#ffffff" font-size="22" font-weight="700">单票分析结果</text>
  <text x="40" y="90" fill="#636e72" font-size="12">Single Ticker Analysis</text>

  <line x1="40" y1="105" x2="760" y2="105" stroke="#2d3436" stroke-width="1"/>

  <!-- Ticker Header -->
  <rect x="40" y="120" width="720" height="60" rx="8" fill="#16213e" filter="url(#shadow)"/>
  <text x="60" y="148" fill="#ffffff" font-size="28" font-weight="700">$ASTC</text>
  <text x="60" y="168" fill="#636e72" font-size="12">Advanced Silicon Technologies Corp.</text>
  <rect x="600" y="130" width="140" height="40" rx="20" fill="url(#buyable)"/>
  <text x="670" y="155" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">BUYABLE ✅</text>

  <!-- Verdict Section -->
  <rect x="40" y="200" width="350" height="140" rx="8" fill="#16213e" filter="url(#shadow)"/>
  <text x="55" y="225" fill="#636e72" font-size="11" letter-spacing="2">VERDICT DETAILS</text>
  
  <text x="55" y="255" fill="#b2bec3" font-size="12">阶段判断</text>
  <text x="200" y="255" fill="#ffffff" font-size="13" font-weight="600">Supernova (#3)</text>
  
  <text x="55" y="280" fill="#b2bec3" font-size="12">PREPARE 评分</text>
  <text x="200" y="280" fill="#ffffff" font-size="13" font-weight="600">12/14</text>
  
  <text x="55" y="305" fill="#b2bec3" font-size="12">交易风格</text>
  <text x="200" y="305" fill="#ffffff" font-size="13" font-weight="600">恐慌接多 / Momentum Chase</text>
  
  <text x="55" y="330" fill="#b2bec3" font-size="12">关键提示</text>
  <text x="200" y="330" fill="#ffffff" font-size="13" font-weight="600">催化剂明确，浮动盘紧</text>

  <!-- Entry/Stop/Target Section -->
  <rect x="410" y="200" width="350" height="140" rx="8" fill="#16213e" filter="url(#shadow)"/>
  <text x="425" y="225" fill="#636e72" font-size="11" letter-spacing="2">TRADE PARAMETERS</text>

  <text x="425" y="255" fill="#b2bec3" font-size="12">入场区间</text>
  <text x="570" y="255" fill="#00b894" font-size="13" font-weight="600">$7.20 – $7.50</text>
  
  <text x="425" y="280" fill="#b2bec3" font-size="12">止损位</text>
  <text x="570" y="280" fill="#ff7675" font-size="13" font-weight="600">$6.60 (–8%)</text>
  
  <text x="425" y="305" fill="#b2bec3" font-size="12">目标区间</text>
  <text x="570" y="305" fill="#fdcb6e" font-size="13" font-weight="600">$9.50 – $10.00 (+30%)</text>
  
  <text x="425" y="330" fill="#b2bec3" font-size="12">风险回报比</text>
  <text x="570" y="330" fill="#ffffff" font-size="13" font-weight="600">1 : 3.8 ✅</text>

  <!-- PREPARE Score Bar -->
  <rect x="40" y="360" width="720" height="220" rx="8" fill="#16213e" filter="url(#shadow)"/>
  <text x="55" y="385" fill="#636e72" font-size="11" letter-spacing="2">PREPARE 评分量表</text>

  <!-- P - Pattern -->
  <text x="55" y="415" fill="#b2bec3" font-size="11">P</text>
  <text x="70" y="415" fill="#636e72" font-size="11">Pattern / Price</text>
  <rect x="200" y="403" width="530" height="20" rx="4" fill="#2d3436"/>
  <rect x="200" y="403" width="480" height="20" rx="4" fill="#00b894" opacity="0.8"/>
  <rect x="680" y="403" width="50" height="20" rx="4" fill="#00cec9"/>
  <text x="710" y="417" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">强</text>

  <!-- R - Reason -->
  <text x="55" y="440" fill="#b2bec3" font-size="11">R</text>
  <text x="70" y="440" fill="#636e72" font-size="11">Reason（催化剂）</text>
  <rect x="200" y="428" width="530" height="20" rx="4" fill="#2d3436"/>
  <rect x="200" y="428" width="450" height="20" rx="4" fill="#00b894" opacity="0.8"/>
  <text x="710" y="442" fill="#dfe6e9" font-size="10" font-weight="700" text-anchor="middle">中</text>

  <!-- E - Ease -->
  <text x="55" y="465" fill="#b2bec3" font-size="11">E</text>
  <text x="70" y="465" fill="#636e72" font-size="11">Ease of Entry/Exit</text>
  <rect x="200" y="453" width="530" height="20" rx="4" fill="#2d3436"/>
  <rect x="200" y="453" width="480" height="20" rx="4" fill="#00b894" opacity="0.8"/>
  <text x="710" y="467" fill="#dfe6e9" font-size="10" font-weight="700" text-anchor="middle">强</text>

  <!-- P - Past -->
  <text x="55" y="490" fill="#b2bec3" font-size="11">P</text>
  <text x="70" y="490" fill="#636e72" font-size="11">Past Performance</text>
  <rect x="200" y="478" width="530" height="20" rx="4" fill="#2d3436"/>
  <rect x="200" y="478" width="400" height="20" rx="4" fill="#00b894" opacity="0.8"/>
  <text x="710" y="492" fill="#dfe6e9" font-size="10" font-weight="700" text-anchor="middle">中</text>

  <!-- A - Agenda -->
  <text x="55" y="515" fill="#b2bec3" font-size="11">A</text>
  <text x="70" y="515" fill="#636e72" font-size="11">Agenda / Timing</text>
  <rect x="200" y="503" width="530" height="20" rx="4" fill="#2d3436"/>
  <rect x="200" y="503" width="480" height="20" rx="4" fill="#00b894" opacity="0.8"/>
  <text x="710" y="517" fill="#dfe6e9" font-size="10" font-weight="700" text-anchor="middle">强</text>

  <!-- R - Risk -->
  <text x="55" y="540" fill="#b2bec3" font-size="11">R</text>
  <text x="70" y="540" fill="#636e72" font-size="11">Risk / Reward</text>
  <rect x="200" y="528" width="530" height="20" rx="4" fill="#2d3436"/>
  <rect x="200" y="528" width="480" height="20" rx="4" fill="#00b894" opacity="0.8"/>
  <text x="710" y="542" fill="#dfe6e9" font-size="10" font-weight="700" text-anchor="middle">强</text>

  <!-- E - Environment -->
  <text x="55" y="565" fill="#b2bec3" font-size="11">E</text>
  <text x="70" y="565" fill="#636e72" font-size="11">Environment</text>
  <rect x="200" y="553" width="530" height="20" rx="4" fill="#2d3436"/>
  <rect x="200" y="553" width="350" height="20" rx="4" fill="#00b894" opacity="0.8"/>
  <text x="710" y="567" fill="#dfe6e9" font-size="10" font-weight="700" text-anchor="middle">中</text>
</svg>
