<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="420" fill="url(#bg)" rx="12"/>

  <text x="40" y="45" fill="#00b894" font-size="14" font-weight="600" letter-spacing="3">SYKES PENNYSTOCK RADAR</text>
  <text x="40" y="70" fill="#ffffff" font-size="22" font-weight="700">PREPARE 评分对比</text>
  <text x="40" y="90" fill="#636e72" font-size="12">Score Comparison — Multiple Tickers</text>

  <line x1="40" y1="105" x2="760" y2="105" stroke="#2d3436" stroke-width="1"/>

  <!-- Table Header -->
  <rect x="40" y="120" width="720" height="30" rx="6" fill="#16213e"/>
  <text x="60" y="140" fill="#636e72" font-size="11" font-weight="600">标的</text>
  <text x="180" y="140" fill="#636e72" font-size="11" font-weight="600">阶段</text>
  <text x="300" y="140" fill="#636e72" font-size="11" font-weight="600">PREPARE 评分</text>
  <text x="440" y="140" fill="#636e72" font-size="11" font-weight="600">风险回报</text>
  <text x="560" y="140" fill="#636e72" font-size="11" font-weight="600">结论</text>

  <!-- Row 1: ASTC -->
  <rect x="40" y="155" width="720" height="40" rx="4" fill="#1e2d4a"/>
  <text x="60" y="180" fill="#ffffff" font-size="14" font-weight="700">$ASTC</text>
  <text x="180" y="180" fill="#00cec9" font-size="13">Supernova</text>
  <text x="300" y="180" fill="#ffffff" font-size="13">12 / 14</text>
  <text x="440" y="180" fill="#ffffff" font-size="13">1 : 3.8 ✅</text>
  <rect x="540" y="163" width="80" height="26" rx="13" fill="#00b894"/>
  <text x="580" y="180" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Buyable</text>

  <!-- Row 2: PAVS -->
  <rect x="40" y="198" width="720" height="40" rx="4" fill="#16213e"/>
  <text x="60" y="223" fill="#ffffff" font-size="14" font-weight="700">$PAVS</text>
  <text x="180" y="223" fill="#00cec9" font-size="13">Ramp→Supernova</text>
  <text x="300" y="223" fill="#ffffff" font-size="13">11 / 14</text>
  <text x="440" y="223" fill="#ffffff" font-size="13">1 : 3.2 ✅</text>
  <rect x="540" y="206" width="80" height="26" rx="13" fill="#00b894"/>
  <text x="580" y="223" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Buyable</text>

  <!-- Row 3: INHD -->
  <rect x="40" y="241" width="720" height="40" rx="4" fill="#1e2d4a"/>
  <text x="60" y="266" fill="#ffffff" font-size="14" font-weight="700">$INHD</text>
  <text x="180" y="266" fill="#fdcb6e" font-size="13">Supernova 晚期</text>
  <text x="300" y="266" fill="#ffffff" font-size="13">7 / 14</text>
  <text x="440" y="266" fill="#ffffff" font-size="13">1 : 1.5 ⚠️</text>
  <rect x="530" y="249" width="100" height="26" rx="13" fill="#fdcb6e"/>
  <text x="580" y="266" fill="#1a1a2e" font-size="11" font-weight="700" text-anchor="middle">Watchlist</text>

  <!-- Row 4: EDHL -->
  <rect x="40" y="284" width="720" height="40" rx="4" fill="#16213e"/>
  <text x="60" y="309" fill="#ffffff" font-size="14" font-weight="700">$EDHL</text>
  <text x="180" y="309" fill="#00cec9" font-size="13">Ramp 早期</text>
  <text x="300" y="309" fill="#ffffff" font-size="13">9 / 14</text>
  <text x="440" y="309" fill="#ffffff" font-size="13">1 : 2.8 ✅</text>
  <rect x="540" y="292" width="80" height="26" rx="13" fill="#00b894"/>
  <text x="580" y="309" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Buyable</text>

  <!-- Row 5: XXX (Avoid example) -->
  <rect x="40" y="327" width="720" height="40" rx="4" fill="#1e2d4a"/>
  <text x="60" y="352" fill="#636e72" font-size="14" font-weight="700">$XXX</text>
  <text x="180" y="352" fill="#ff7675" font-size="13">Long Kiss Night</text>
  <text x="300" y="352" fill="#636e72" font-size="13">2 / 14</text>
  <text x="440" y="352" fill="#636e72" font-size="13">N/A ❌</text>
  <rect x="545" y="335" width="70" height="26" rx="13" fill="#ff7675"/>
  <text x="580" y="352" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Avoid</text>

  <!-- Legend -->
  <text x="40" y="400" fill="#636e72" font-size="11">● 绿色 = 可买入  ● 黄色 = 观望  ● 红色 = 远离</text>
</svg>
